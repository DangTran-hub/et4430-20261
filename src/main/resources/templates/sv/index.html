<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Sinh viên')}"></head>
<body>
<header th:replace="~{fragments :: svTop}"></header>
<div class="page">
    <div th:replace="~{fragments :: flash}"></div>
    <nav th:replace="~{fragments :: svTabs('home')}"></nav>

    <div class="tab-body">
        <section class="card">
            <div class="profile">
                <div>
                    <h2 th:text="${student.user.fullName}">Họ tên</h2>
                    <div class="muted" th:text="'MSSV ' + ${student.studentCode} + ' · Lớp ' + ${student.classCode}"></div>
                </div>
                <div class="warning-box">
                    <span class="field-label">Trạng thái cảnh báo học tập</span>
                    <span th:class="${@fmt.warningCss(student.academicWarningLevel)}"
                          th:text="${@fmt.warning(student.academicWarningLevel)}">Bình thường</span>
                    <span class="muted small" th:text="${@fmt.warningDesc(student.academicWarningLevel)}"></span>
                </div>
            </div>

            <h2 class="mt">Đợt đăng ký học phần</h2>
            <p th:if="${#lists.isEmpty(campaigns)}" class="muted">Hiện chưa có đợt đăng ký nào được công bố.</p>
            <div class="table-wrap" th:unless="${#lists.isEmpty(campaigns)}">
                <table class="table-upper">
                    <thead>
                    <tr><th>Năm học</th><th>Học kỳ</th><th>Bắt đầu</th><th>Kết thúc</th><th>Trạng thái</th><th>Hành động</th></tr>
                    </thead>
                    <tbody>
                    <tr th:each="c : ${campaigns}">
                        <td th:text="${c.term.academicYear}"></td>
                        <td th:text="${@fmt.term(c.term)}"></td>
                        <td th:text="${@fmt.dt(c.registrationOpenAt)}"></td>
                        <td th:text="${@fmt.dt(c.registrationCloseAt)}"></td>
                        <td class="center"><span th:class="${@fmt.windowCss(c)}" th:text="${@fmt.window(c)}"></span></td>
                        <td class="actions"><a class="btn btn-sm btn-primary" th:href="@{/sv/campaigns/{id}(id=${c.id})}">Xem học phần</a></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <aside class="card">
            <h2>Thông báo từ Phòng Đào tạo</h2>
            <p th:if="${#lists.isEmpty(notifications)}" class="muted">Chưa có thông báo.</p>
            <article class="notice" th:each="n : ${notifications}">
                <h3 th:text="${n.title}">Tiêu đề</h3>
                <div class="muted small" th:text="'Đăng lúc ' + ${@fmt.dt(n.publishedAt)}"></div>
                <p th:text="${n.body}">Nội dung</p>
            </article>
        </aside>
    </div>
    <footer th:replace="~{fragments :: footer}"></footer>
</div>
</body>
</html>
