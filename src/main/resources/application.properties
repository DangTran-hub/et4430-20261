spring.application.name=quanlyhocphan
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false

# Lazy-loading trong template Thymeleaf (mặc định của Spring Boot, khai báo để tắt cảnh báo)
spring.jpa.open-in-view=true

# Tạo tài khoản và dữ liệu demo khi DB chưa có tài khoản "pdt" (xem DemoDataInitializer)
app.demo-data=true
